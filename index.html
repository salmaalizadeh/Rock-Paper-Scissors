<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>سنگ کاغذ قیچی</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <div class="game">
      <h1>سنگ کاغذ قیچی</h1>

      <p>انتخاب تو: <span class="user-choice">؟</span></p>
      <p>انتخاب کامپیوتر: <span class="computer-choice">؟</span></p>

      <h2 class="result">یکی را انتخاب کن!</h2>

      <div class="buttons">
        <button class="choice" value="سنگ">✊ سنگ</button>
        <button class="choice" value="کاغذ">✋ کاغذ</button>
        <button class="choice" value="قیچی">✌️ قیچی</button>
      </div>
    </div>
  </body>
</html>
